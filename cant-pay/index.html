<title>Boostra · Прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap">
<style>
/* Общий стиль стенда и прототипов Boostra: нейтральное тёмное «стекло».
   Снят с её стартовой страницы стенда (SandBox, «Starp Page 1440», узел 1091:137) 2026-10-14 и заменил синее стекло от 2026-10-12.
   Чёрный фон, полупрозрачные серые плитки, белый текст, серые кнопки. Цвет даёт только синее свечение, как вокруг кубика на первой картинке.
   Подключается первым; своё страница дописывает отдельным файлом. */
:root {
  /* поверхности: значения сняты с её макета */
  --surface-1: rgba(255, 255, 255, .055);   /* плитка */
  --surface-2: rgba(255, 255, 255, .15);    /* иконка, бейдж, тег */
  --surface-3: rgba(255, 255, 255, .24);    /* кнопка */
  --surface-4: rgba(255, 255, 255, .32);    /* кнопка при наведении */
  --halo: #1d3cff;                          /* синее свечение, как на первой картинке */
  --ink: #fff;
  --ink-2: rgba(255, 255, 255, .64);
  --ink-3: rgba(255, 255, 255, .42);
  --stroke: rgba(255, 255, 255, .15);
  --stroke-strong: rgba(255, 255, 255, .4);
  --glass: rgba(255, 255, 255, .055);
  --glass-shadow: 0 18px 50px rgba(0, 0, 0, .5);
  --glass-shadow-on: 0 26px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .1);
  --ease: cubic-bezier(.2, .8, .2, 1);
  /* статусы сценариев */
  --st-asis: #9fb0cc;
  --st-concept: #b9a4ff;
  --st-review: #ffb46b;
  --st-ready: #6fd6ff;
  --st-dev: #4d9bff;
  --st-released: #5ee2a0;
  --st-exp: #ffcf5c;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: #000;
  color: var(--ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 20px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

/* ---------- Фон: свечения и точечная сетка. Разметка: <div class="bg"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div> ---------- */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #000; }
.bg i { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .2; animation: drift 30s ease-in-out infinite alternate; }
.bg .g1 { display: none; }
.bg .g2 { width: 620px; height: 420px; left: 50%; margin-left: -310px; top: -300px; background: var(--halo); }
.bg .g3 { width: 420px; height: 420px; right: -160px; bottom: -260px; background: var(--halo); opacity: .1; animation-duration: 38s; animation-delay: -14s; }
.bg::after {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 38%, #000 28%, transparent 82%);
  mask-image: radial-gradient(ellipse at 50% 38%, #000 28%, transparent 82%);
}
@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(70px, -50px, 0) scale(1.18); }
}
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.96); } }
@keyframes fade { from { opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -18; } }
@keyframes sweep { to { transform: translateX(100%); } }

/* ---------- Шапка страницы ---------- */
.app { position: relative; z-index: 1; padding: 28px 40px 56px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-3); }
.crumbs b { font-weight: 400; opacity: .6; }
.crumbs a { text-decoration: none; transition: color .2s; }
.crumbs a:hover { color: var(--ink); }
.crumbs > :last-child { color: var(--ink-2); }
.top-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-top: 14px; }
.top-title h1 { margin: 0; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; }
.top-title p { margin: 8px 0 0; max-width: 620px; font-size: 15px; line-height: 22px; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 8px;
  font-size: 12px; line-height: 22px; font-weight: 500; letter-spacing: .01em; white-space: nowrap;
  color: #fff; background: var(--surface-2); border: 1px solid transparent;
}
.tag-status { color: #fff; }
.tag-muted { color: var(--ink-3); border-color: var(--stroke); border-style: dashed; background: none; }
.tag .st:empty { gap: 0; }
.top-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* статус: точка и подпись, цвет задаёт data-st */
.st { --c: var(--st-asis); display: inline-flex; align-items: center; gap: 7px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--c); white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
[data-st="asis"] { --c: var(--st-asis); }
[data-st="concept"] { --c: var(--st-concept); }
[data-st="review"] { --c: var(--st-review); }
[data-st="ready"] { --c: var(--st-ready); }
[data-st="dev"] { --c: var(--st-dev); }
[data-st="released"] { --c: var(--st-released); }
[data-st="exp"], [data-kind="exp"] { --c: var(--st-exp); }
[data-kind="current"] { --c: var(--st-asis); }
[data-kind="concept"] { --c: var(--st-concept); }
/* тег версии: текущая, в эксперименте, концепт */
.tag[data-kind] { gap: 7px; font-weight: 600; color: var(--c); }
.tag[data-kind]::before, .vers button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }

/* переключатель и кнопки */
.seg { display: flex; padding: 3px; border-radius: 14px; background: var(--surface-1); border: 1px solid var(--stroke); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.seg button {
  height: 34px; padding: 0 14px; border: 0; border-radius: 11px; background: transparent; color: var(--ink-2);
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .25s, color .25s;
}
.seg button[aria-pressed="true"] { background: var(--surface-3); color: #fff; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border: 0; border-radius: 16px; cursor: pointer;
  color: #fff; text-decoration: none; font: inherit; font-size: 14px; font-weight: 500;
  background: var(--surface-3); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: transform .25s var(--ease), background .25s;
}
.btn:hover { transform: translateY(-1px); background: var(--surface-4); }
.btn-ghost { background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--stroke); }
.btn-ghost:hover { background: var(--surface-2); }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ---------- Стеклянная плитка ---------- */
.glass {
  border-radius: 24px; border: 1px solid var(--stroke); background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
  box-shadow: var(--glass-shadow); color: inherit;
}

/* ---------- Скелетон экрана (собирает skeletons.js) ---------- */
.sk { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.sk i, .sk b { display: block; flex: none; border-radius: 6px; background: rgba(255, 255, 255, .099); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .09); }
.sk .a { background: rgba(255, 255, 255, .34); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5); }
.sk .ok { background: rgba(0, 160, 67, .36); box-shadow: inset 0 0 0 1px rgba(110, 231, 160, .6); }
.sk .bad { background: rgba(255, 2, 57, .4); box-shadow: inset 0 0 0 1px rgba(255, 120, 150, .55); }
.sk .o { background: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .252); }
.sk .dash { background: none; box-shadow: none; border: 1px dashed rgba(255, 255, 255, .36); }
.sk .rnd { border-radius: 50%; }
.sk .row { display: flex; gap: 5px; align-items: center; }
.sk .col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sk .between { justify-content: space-between; }
.sk .center { justify-content: center; align-items: center; }
.sk .grow { flex: 1; min-width: 0; }
.sk .box.help { background: rgba(255, 255, 255, .11); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3); }
.sk .box { flex: none; display: flex; flex-direction: column; gap: 5px; padding: 7px; border-radius: 10px; background: rgba(255, 255, 255, .072); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .108); }
.sk-loan { flex: none; border-radius: 10px; padding: 0 0 7px; display: flex; flex-direction: column; gap: 5px; background: rgba(255, 255, 255, .072); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .108); overflow: hidden; }
.sk-loan.hl { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .48), 0 0 16px rgba(255, 255, 255, .203); background: rgba(255, 255, 255, .09); }
.sk-loan .strip { height: 12px; border-radius: 0; background: rgba(255, 255, 255, .126); box-shadow: none; }
.sk-loan.overdue .strip { background: rgba(255, 2, 57, .5); }
.sk-loan .l { height: 6px; margin-left: 8px; }
.sk-btn { height: 16px; border-radius: 8px; }
.sk-btn.primary { background: rgba(255, 255, 255, .144); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
.sk-sheet .back, .sk .back { opacity: .55; display: flex; flex-direction: column; gap: 5px; }
.sk-panel {
  flex: 1; min-height: 0; margin-top: 2px; padding: 7px 8px 0; display: flex; flex-direction: column; gap: 5px;
  border-radius: 14px 14px 0 0; background: rgba(255, 255, 255, .072); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .126);
}
.sk-panel .grab { width: 22px; height: 3px; border-radius: 2px; align-self: center; box-shadow: none; background: rgba(255, 255, 255, .27); }
.sk-panel .alert { height: 16px; background: rgba(0, 160, 67, .34); box-shadow: inset 0 0 0 1px rgba(110, 231, 160, .6); transition: height .4s var(--ease), opacity .3s, margin .4s var(--ease); }
[data-dpd="late"] .sk-panel .alert { height: 0; opacity: 0; margin-bottom: -5px; }
.sk-panel .bub { border-radius: 8px 8px 8px 3px; }
.sk-panel .bub.me { align-self: flex-end; border-radius: 8px 8px 3px 8px; background: rgba(255, 255, 255, .135); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .24); }
.sk-panel .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.sk-panel .chips i { height: 12px; border-radius: 6px; }
.sk-panel .chips .m { background: rgba(255, 255, 255, .081); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .144); }
.sk-panel .inp { display: flex; gap: 5px; align-items: center; }
.sk-panel .inp i { flex: 1; height: 14px; border-radius: 7px; }
.sk-panel .inp b { width: 14px; height: 14px; border-radius: 50%; }
.sk-panel .kbd { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin: 0 -2px; }
.sk-panel .kbd i { height: 8px; border-radius: 3px; }
/* блик по скелетону: включается классом .shine на родителе или наведением на [data-shine] */
.sk::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .252) 50%, transparent 65%);
  transform: translateX(-100%);
}
[data-shine]:hover .sk::after, .shine .sk::after { opacity: 1; animation: sweep 1.6s ease-in-out infinite; }

@media (max-width: 760px) {
  .app { padding: 20px 16px 40px; }
  .top-title h1 { font-size: 26px; line-height: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  .bg i, .sk::after { animation: none !important; }
  .btn, .seg button { transition: none !important; }
}

</style>
<style>
/* Карта экранов: холст, связи, карточки, зоны и панель. Движок: flowmap.js. Общий стиль: theme.css */
.map-wrap { position: relative; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; }
.zones, .nodes { position: absolute; left: 0; top: 0; }

.edge-base { fill: none; stroke: rgba(255, 255, 255, .216); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.edge-flow { fill: none; stroke: #d9d9d9; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 3 15; opacity: .5; animation: flow 1.8s linear infinite; }
.edge { transition: opacity .3s; animation: fade .6s ease backwards; animation-delay: var(--d, 0s); }
.edge.draw .edge-base { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw .9s var(--ease) backwards; animation-delay: var(--d, 0s); }
.edge.dash .edge-base { stroke-dasharray: 5 7; }
.edge.on .edge-base { stroke: #ededed; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(255, 255, 255, .427)); }
.edge.on .edge-flow { opacity: 1; stroke: #fff; animation-duration: .9s; }
.dim .edge:not(.on) { opacity: .42; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* ---------- Зона: группа экранов в рамке ---------- */
.zone {
  position: absolute; border-radius: 32px; border: 1px dashed rgba(255, 255, 255, .156); background: rgba(255, 255, 255, .021);
  pointer-events: none; animation: fade .8s ease backwards; animation-delay: var(--d, 0s);
}
.zone-label {
  position: absolute; left: 22px; top: -13px; height: 26px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px;
  border-radius: 999px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap;
  background: #141414; border: 1px solid rgba(255, 255, 255, .204); pointer-events: auto; transition: border-color .2s, background .2s;
}
a.zone-label:hover { border-color: var(--stroke-strong); background: #1f1f1f; }
.zone-label small { font-size: 12px; font-weight: 500; color: var(--ink-3); }

/* ---------- Карточка экрана ---------- */
.node {
  position: absolute; width: 208px; height: 196px; padding: 14px 14px 0; margin: 0;
  display: flex; flex-direction: column; gap: 12px; overflow: hidden;
  border-radius: 24px; border: 1px solid var(--stroke); background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
  box-shadow: var(--glass-shadow);
  color: inherit; font: inherit; text-align: left; cursor: pointer;
  transition: transform .35s var(--ease), border-color .25s, box-shadow .35s, opacity .3s;
  animation: rise .7s var(--ease) backwards; animation-delay: var(--d, 0s);
}
.node:hover, .node.on, .node.sel { transform: translateY(-4px); border-color: var(--stroke-strong); box-shadow: var(--glass-shadow-on); }
.node.sel { border-color: #ededed; }
.dim .node:not(.rel) { opacity: .55; }
.node.off, .via.off { opacity: .22; }
/* приглушённая карточка (не горит в выбранном состоянии клиента) при наведении и выборе становится яркой, как раньше */
.node.off:hover, .node.off.sel { opacity: 1; }
.node h3 { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 15px; line-height: 20px; font-weight: 650; letter-spacing: -.01em; }
.node h3 > span:last-child { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.step {
  flex: none; height: 20px; min-width: 20px; padding: 0 6px; border-radius: 999px; text-align: center;
  font-size: 11px; line-height: 18px; font-weight: 600; color: #ededed;
  background: rgba(255, 255, 255, .135); border: 1px solid rgba(255, 255, 255, .24);
}

/* крупная карточка: главная кабинета в центре карты, от неё расходятся флоу (её просьба 2026-10-16) */
.node.big { width: 280px; height: 640px; padding: 18px 18px 0; gap: 14px; border-radius: 30px; border-color: var(--stroke-strong);
  background: radial-gradient(90% 60% at 50% 0%, rgba(29, 60, 255, .22), transparent 70%), var(--glass); box-shadow: var(--glass-shadow-on); }
.node.big h3 { font-size: 20px; line-height: 26px; font-weight: 700; }

/* выход: существующий флоу или переход в другой раздел */
.node.exit {
  height: 64px; padding: 0 14px; flex-direction: row; align-items: center; gap: 10px;
  border-radius: 18px; border-style: dashed; border-color: rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .054);
}
.node.exit .ico { flex: none; width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .135); color: #ededed; }
.node.exit h3 { font-size: 13px; line-height: 18px; font-weight: 600; }

/* пилюля над карточкой: что нажал клиент или статус сценария */
.via {
  position: absolute; height: 22px; padding: 0 9px 0 7px; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  border-radius: 999px; font-size: 11px; line-height: 20px; font-weight: 500; color: #e0e0e0;
  background: rgba(0, 0, 0, .792); border: 1px solid rgba(255, 255, 255, .18);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: opacity .3s; animation: rise .7s var(--ease) backwards; animation-delay: var(--d, 0s);
}
.via::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, .6); }
.via.warn::before { background: #ff5b7d; box-shadow: 0 0 8px #ff2a57; }
.via[data-st] { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); font-weight: 600; }
.via[data-st]::before { background: var(--c); box-shadow: 0 0 8px var(--c); }
.dim .via:not(.rel) { opacity: .5; }

.node:hover .sk::after, .node.sel .sk::after { opacity: 1; animation: sweep 1.6s ease-in-out infinite; }

/* ---------- Обозначения под картой ---------- */
.map-legend { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: var(--ink-2); }
.map-legend li { display: flex; align-items: center; gap: 8px; }
.lg { width: 22px; height: 14px; border-radius: 5px; border: 1px solid var(--stroke-strong); background: rgba(255, 255, 255, .084); }
.lg-exit { border-style: dashed; background: rgba(255, 255, 255, .072); }
.lg-via { height: 10px; border-radius: 999px; background: rgba(0, 0, 0, .88); border-color: rgba(255, 255, 255, .24); }
.lg-loop { height: 0; border: 0; border-top: 2px dashed var(--ink-2); border-radius: 0; background: none; }
.lg-zone { border-style: dashed; border-color: rgba(255, 255, 255, .24); background: rgba(255, 255, 255, .03); border-radius: 7px; }

/* ---------- Док справа: теги сценария и живой прототип. Карту не закрывает: страница отдаёт ему место ---------- */
.app { transition: padding-right .45s var(--ease); }
body.dock-open .app { padding-right: calc(var(--dock, 400px) + 40px); }
.map-wrap { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .18) transparent; }
.panel {
  position: fixed; z-index: 5; right: 20px; top: 20px; bottom: 20px; width: var(--dock, 400px); padding: 20px;
  display: flex; flex-direction: column; gap: 16px; overflow: hidden;
  border-radius: 28px; border: 1px solid var(--stroke); background: rgba(18, 18, 18, .82);
  -webkit-backdrop-filter: blur(28px) saturate(160%); backdrop-filter: blur(28px) saturate(160%);
  box-shadow: 0 30px 90px rgba(0, 0, 0, .77), inset 0 1px 0 rgba(255, 255, 255, .16);
  transform: translateX(calc(100% + 40px)); opacity: 0; visibility: hidden;
  transition: transform .45s var(--ease), opacity .3s, width .45s var(--ease), visibility 0s .45s;
}
.panel.open { transform: none; opacity: 1; visibility: visible; transition: transform .45s var(--ease), opacity .3s, width .45s var(--ease); }
.panel-close { position: absolute; z-index: 2; right: 14px; top: 14px; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .06); color: var(--ink-2); cursor: pointer; }
.panel-close:hover { background: rgba(255, 255, 255, .12); color: #fff; }
.panel-body { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .18) transparent; }
.panel.has-proto .panel-body { flex: 0 1 auto; max-height: 40%; }
.panel .eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-right: 40px; font-size: 12px; color: var(--ink-3); }
.panel h2 { margin: 8px 36px 0 0; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -.01em; }

     Правила как у карты (catalog.js, goNext): to = название сценария или выхода; без to первая связь из карточки, через развилку по первому ответу.

  /* следующая карточка по карте раздела; выход в другой раздел даёт его адрес */
